<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 – Seite nicht gefunden | Datenflix007</title>

  <meta name="description" content="Die aufgerufene Seite wurde nicht gefunden.">

  <style>
    :root {
      --bg: #0b0d10;
      --surface: #111418;
      --surface-2: #151a21;
      --muted: #8892a6;
      --text: #e6e9ef;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
      --accent-3: #62e0c0;
      --ring: #334155;
      --blue-deep: #263858;
      --shadow: 0 24px 80px rgba(2, 6, 23, 0.58);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow: hidden;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(circle at 20% 15%, rgba(125, 211, 252, .10), transparent 28%),
        radial-gradient(circle at 82% 75%, rgba(167, 139, 250, .10), transparent 30%),
        radial-gradient(circle at 50% 50%, rgba(98, 224, 192, .03), transparent 45%),
        var(--bg);

      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(rgba(125, 211, 252, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125, 211, 252, .025) 1px, transparent 1px);

      background-size: 42px 42px;

      mask-image:
        radial-gradient(circle at center, black 25%, transparent 78%);

      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.008),
          rgba(255,255,255,.008) 1px,
          transparent 1px,
          transparent 3px
        );

      opacity: .35;
      pointer-events: none;
    }

    a {
      color: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: relative;
      z-index: 20;

      border-bottom: 1px solid #263858;

      background: rgba(9, 13, 22, .78);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .nav {
      width: min(calc(100% - 40px), 1100px);
      margin: 0 auto;

      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      text-decoration: none;

      font-weight: 750;
      letter-spacing: .02em;
    }

    .brand-dot {
      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: var(--accent-3);

      box-shadow:
        0 0 10px var(--accent-3),
        0 0 28px rgba(98, 224, 192, .55);
    }

    .home-link {
      padding: 8px 14px;

      border: 1px solid #263858;
      border-radius: 999px;

      color: #b8c6da;

      text-decoration: none;
      font-size: .9rem;
      font-weight: 650;

      background: rgba(255,255,255,.015);

      transition:
        border-color .2s ease,
        background .2s ease,
        transform .2s ease;
    }

    .home-link:hover {
      transform: translateY(-1px);
      border-color: #47648d;
      background: #16233a;
    }

    /* =========================
       PAGE
    ========================= */

    main {
      min-height: calc(100vh - 70px);

      display: grid;
      place-items: center;

      padding: 48px 20px;

      position: relative;
      z-index: 2;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .16;
      pointer-events: none;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb-a {
      width: 340px;
      height: 340px;

      top: 18%;
      left: 12%;

      background: var(--accent);
    }

    .orb-b {
      width: 380px;
      height: 380px;

      bottom: 5%;
      right: 10%;

      background: var(--accent-2);

      animation-delay: -3s;
    }

    @keyframes float {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(24px, -18px, 0);
      }
    }

    /* =========================
       CARD
    ========================= */

    .error-shell {
      position: relative;

      width: min(100%, 820px);

      border-radius: 28px;

      padding: 1px;

      background:
        linear-gradient(
          135deg,
          rgba(125, 211, 252, .42),
          rgba(51, 65, 85, .45) 45%,
          rgba(167, 139, 250, .32)
        );

      box-shadow:
        0 0 0 1px rgba(255,255,255,.015),
        var(--shadow);
    }

    .error-card {
      position: relative;

      overflow: hidden;

      border-radius: 27px;

      padding: clamp(34px, 6vw, 68px);

      background:
        linear-gradient(
          180deg,
          rgba(17, 20, 24, .98),
          rgba(13, 17, 23, .98)
        );
    }

    .error-card::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at 50% 0%, rgba(125, 211, 252, .08), transparent 32%),
        radial-gradient(circle at 85% 100%, rgba(167, 139, 250, .08), transparent 36%);

      pointer-events: none;
    }

    .error-card::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          115deg,
          transparent 30%,
          rgba(255,255,255,.025) 50%,
          transparent 70%
        );

      transform: translateX(-130%);
      animation: shine 7s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0%,
      70% {
        transform: translateX(-130%);
      }

      100% {
        transform: translateX(130%);
      }
    }

    /* =========================
       STATUS
    ========================= */

    .status-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;

      margin-bottom: 18px;

      color: var(--muted);

      font-size: .82rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #f59e0b;

      box-shadow: 0 0 14px rgba(245, 158, 11, .55);

      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .45;
      }
    }

    /* =========================
       404
    ========================= */

    .error-code-wrap {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: center;
    }

    .error-code {
      position: relative;

      margin: 0;

      font-size: clamp(6.5rem, 17vw, 11rem);
      line-height: .8;

      font-weight: 900;
      letter-spacing: -.08em;

      background:
        linear-gradient(
          135deg,
          #a8d8ff 0%,
          var(--accent) 28%,
          #8098ff 62%,
          var(--accent-2) 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      filter:
        drop-shadow(0 0 20px rgba(125, 211, 252, .13))
        drop-shadow(0 0 45px rgba(167, 139, 250, .08));

      user-select: none;
    }

    .error-code::before,
    .error-code::after {
      content: "404";

      position: absolute;
      inset: 0;

      opacity: 0;
      pointer-events: none;
    }

    .error-code::before {
      color: #7dd3fc;
      transform: translateX(-3px);
    }

    .error-code::after {
      color: #a78bfa;
      transform: translateX(3px);
    }

    .error-code:hover::before {
      opacity: .16;
    }

    .error-code:hover::after {
      opacity: .12;
    }

    /* =========================
       BADGE
    ========================= */

    .error-badge {
      position: relative;
      z-index: 2;

      width: fit-content;

      margin: 28px auto 0;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 7px 12px;

      border: 1px solid var(--ring);
      border-radius: 999px;

      background: rgba(255,255,255,.018);

      color: #aab6c8;

      font-size: .82rem;
    }

    .error-badge span:first-child {
      opacity: .7;
    }

    /* =========================
       CONTENT
    ========================= */

    h1 {
      position: relative;
      z-index: 2;

      margin: 22px 0 12px;

      text-align: center;

      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -.03em;
    }

    .description {
      position: relative;
      z-index: 2;

      max-width: 600px;

      margin: 0 auto;

      color: var(--muted);

      text-align: center;

      font-size: 1.02rem;
      line-height: 1.7;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 12px;

      margin-top: 30px;
    }

    .button {
      min-height: 46px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 10px 18px;

      border-radius: 999px;

      text-decoration: none;

      font-weight: 700;

      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease,
        background .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      color: #061014;

      background:
        linear-gradient(
          135deg,
          #8adfff,
          var(--accent-3)
        );

      box-shadow:
        0 10px 30px rgba(98, 224, 192, .12);

      border: 1px solid transparent;
    }

    .button-primary:hover {
      box-shadow:
        0 14px 36px rgba(98, 224, 192, .20);
    }

    .button-secondary {
      color: var(--text);

      border: 1px solid var(--ring);

      background: rgba(255,255,255,.018);
    }

    .button-secondary:hover {
      border-color: #47648d;
      background: #16233a;
    }

    /* =========================
       PATH
    ========================= */

    .path-box {
      position: relative;
      z-index: 2;

      margin-top: 34px;
      padding-top: 22px;

      border-top: 1px solid rgba(51, 65, 85, .75);

      display: flex;
      justify-content: center;
      gap: 7px;

      color: var(--muted);

      font-size: .84rem;

      flex-wrap: wrap;
    }

    .path-box code {
      color: var(--accent);

      overflow-wrap: anywhere;
    }

    /* =========================
       META MESSAGE
    ========================= */

    .signal {
      position: absolute;

      top: 18px;
      right: 20px;

      display: flex;
      align-items: end;
      gap: 3px;

      opacity: .42;
    }

    .signal span {
      width: 3px;

      background: var(--accent);

      border-radius: 10px;

      animation: signal 1.6s ease-in-out infinite;
    }

    .signal span:nth-child(1) {
      height: 5px;
      animation-delay: 0s;
    }

    .signal span:nth-child(2) {
      height: 9px;
      animation-delay: .1s;
    }

    .signal span:nth-child(3) {
      height: 13px;
      animation-delay: .2s;
    }

    .signal span:nth-child(4) {
      height: 17px;
      animation-delay: .3s;
    }

    @keyframes signal {
      50% {
        opacity: .2;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 680px) {
      body {
        overflow: auto;
      }

      .nav {
        width: min(calc(100% - 28px), 1100px);
      }

      main {
        min-height: calc(100vh - 70px);
        padding: 34px 14px;
      }

      .error-card {
        padding:
          34px
          20px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .signal {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<div class="ambient-orb orb-a"></div>
<div class="ambient-orb orb-b"></div>

<header>
  <nav class="nav">

    <a
      href="/"
      class="brand"
      aria-label="Datenflix007 Startseite"
    >
      <span class="brand-dot" aria-hidden="true"></span>
      Datenflix007
    </a>

    <a href="/" class="home-link">
      Startseite
    </a>

  </nav>
</header>

<main>

  <div class="error-shell">

    <section class="error-card">

      <div class="signal" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="status-row">
        <span class="status-dot"></span>
        <span>Lost route detected</span>
      </div>

      <div class="error-code-wrap">
        <p class="error-code">404</p>
      </div>

      <div class="error-badge">
        <span>●</span>
        <span>Diese Seite scheint verschwunden zu sein.</span>
      </div>

      <h1>Seite nicht gefunden</h1>

      <p class="description">
        Die aufgerufene Seite existiert nicht,
        wurde verschoben oder der verwendete Link
        ist nicht mehr aktuell.
      </p>

      <div class="actions">

        <a
          href="/"
          class="button button-primary"
        >
          ← Zur Startseite
        </a>

        <a
          href="javascript:history.back()"
          class="button button-secondary"
        >
          Zurück
        </a>

      </div>

      <div class="path-box">
        <span>Aufgerufener Pfad:</span>
        <code id="requested-path"></code>
      </div>

    </section>

  </div>

</main>

<script>
  const pathElement =
    document.getElementById("requested-path");

  if (pathElement) {
    pathElement.textContent =
      window.location.pathname;
  }
</script>

</body>
</html>
