<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 – Seite nicht gefunden | Datenflix007</title>

    <meta
        name="description"
        content="Die aufgerufene Seite wurde nicht gefunden."
    >

    <style>
        :root {
            --bg: #0b0d10;
            --surface: #111418;
            --muted: #8892a6;
            --text: #e6e9ef;
            --accent: #7dd3fc;
            --accent-2: #a78bfa;
            --ring: #334155;
            --logo: #62e0c0;

            --radius: 16px;
            --shadow: 0 20px 60px rgba(2, 6, 23, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(125, 211, 252, 0.08),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 80% 75%,
                    rgba(167, 139, 250, 0.08),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            display: flex;
            flex-direction: column;
        }

        a {
            color: inherit;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            border-bottom: 1px solid #263858;
            background: rgba(9, 13, 22, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .nav {
            width: min(calc(100% - 40px), 1100px);
            margin: 0 auto;

            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;

            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .logo {
            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: var(--logo);

            box-shadow:
                0 0 10px var(--logo),
                0 0 24px rgba(98, 224, 192, 0.55);
        }

        .home-link {
            padding: 8px 13px;

            border: 1px solid #263858;
            border-radius: 999px;

            color: #aabbd4;

            text-decoration: none;

            font-size: 0.9rem;
            font-weight: 600;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                color 0.2s ease;
        }

        .home-link:hover,
        .home-link:focus-visible {
            color: var(--text);
            border-color: #3b557d;
            background: #16233a;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;

            width: min(calc(100% - 40px), 1100px);
            margin: 0 auto;

            display: grid;
            place-items: center;

            padding: 70px 0;
        }

        .error-card {
            position: relative;

            width: min(100%, 760px);

            padding: clamp(32px, 6vw, 64px);

            overflow: hidden;

            text-align: center;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(125, 211, 252, 0.08),
                    transparent 35%
                ),
                var(--surface);

            border: 1px solid var(--ring);
            border-radius: 24px;

            box-shadow: var(--shadow);
        }

        .error-card::before {
            content: "";

            position: absolute;

            width: 260px;
            height: 260px;

            top: -150px;
            right: -120px;

            border-radius: 50%;

            background: var(--accent);

            filter: blur(90px);

            opacity: 0.12;

            pointer-events: none;
        }

        .error-card::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            bottom: -140px;
            left: -110px;

            border-radius: 50%;

            background: var(--accent-2);

            filter: blur(90px);

            opacity: 0.12;

            pointer-events: none;
        }

        .error-code {
            position: relative;
            z-index: 1;

            margin: 0;

            font-size: clamp(5rem, 18vw, 10rem);
            line-height: 0.9;

            font-weight: 800;
            letter-spacing: -0.06em;

            color: transparent;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent-2)
                );

            -webkit-background-clip: text;
            background-clip: text;

            text-shadow:
                0 0 40px rgba(125, 211, 252, 0.08);
        }

        .error-badge {
            position: relative;
            z-index: 1;

            display: inline-flex;
            align-items: center;

            margin-top: 28px;

            padding: 6px 11px;

            border: 1px solid var(--ring);
            border-radius: 999px;

            color: var(--muted);

            font-size: 0.85rem;
        }

        h1 {
            position: relative;
            z-index: 1;

            margin: 18px 0 12px;

            font-size: clamp(1.7rem, 4vw, 2.4rem);
        }

        .description {
            position: relative;
            z-index: 1;

            max-width: 570px;
            margin: 0 auto;

            color: var(--muted);

            font-size: 1.05rem;
            line-height: 1.7;
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions {
            position: relative;
            z-index: 1;

            margin-top: 32px;

            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 12px;
        }

        .button {
            min-height: 44px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 17px;

            border-radius: 999px;

            text-decoration: none;
            font-weight: 650;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button-primary {
            color: #071019;

            background:
                linear-gradient(
                    135deg,
                    var(--accent),
                    #62e0c0
                );

            border: 1px solid transparent;
        }

        .button-secondary {
            color: var(--text);

            background: rgba(255, 255, 255, 0.02);

            border: 1px solid var(--ring);
        }

        .button-secondary:hover {
            background: #16233a;
            border-color: #3b557d;
        }

        /* =========================
           PATH
        ========================= */

        .requested-path {
            position: relative;
            z-index: 1;

            margin-top: 34px;

            padding-top: 22px;

            border-top: 1px solid rgba(51, 65, 85, 0.7);

            color: var(--muted);

            font-size: 0.86rem;
        }

        .requested-path code {
            color: var(--accent);

            overflow-wrap: anywhere;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 25px 20px 35px;

            color: var(--muted);

            text-align: center;

            font-size: 0.85rem;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 680px) {

            .nav {
                width: min(calc(100% - 28px), 1100px);
                min-height: 62px;
            }

            main {
                width: min(calc(100% - 28px), 1100px);
                padding: 38px 0;
            }

            .error-card {
                padding:
                    36px
                    20px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }

            .error-code {
                font-size: clamp(5rem, 30vw, 8rem);
            }

            .description {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<header>
    <nav class="nav">

        <a
            class="brand"
            href="/"
            aria-label="Datenflix007 Startseite"
        >
            <span
                class="logo"
                aria-hidden="true"
            ></span>

            Datenflix007
        </a>

        <a
            class="home-link"
            href="/"
        >
            Startseite
        </a>

    </nav>
</header>


<main>

    <section
        class="error-card"
        aria-labelledby="error-title"
    >

        <p class="error-code">
            404
        </p>

        <span class="error-badge">
            Diese Seite scheint verschwunden zu sein.
        </span>

        <h1 id="error-title">
            Seite nicht gefunden
        </h1>

        <p class="description">
            Die aufgerufene Seite existiert nicht,
            wurde verschoben oder der verwendete Link
            ist nicht mehr aktuell.
        </p>

        <div class="actions">

            <a
                class="button button-primary"
                href="/"
            >
                Zur Startseite
            </a>

            <a
                class="button button-secondary"
                href="javascript:history.back()"
            >
                Zurück
            </a>

        </div>

        <p class="requested-path">
            Aufgerufener Pfad:
            <code id="requested-path"></code>
        </p>

    </section>

</main>


<footer>
    © Datenflix007
</footer>


<script>
    const pathElement =
        document.getElementById("requested-path");

    if (pathElement) {
        pathElement.textContent =
            window.location.pathname;
    }
</script>

</body>
</html>
