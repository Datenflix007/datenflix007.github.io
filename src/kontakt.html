<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../media/favicon.png">
    <title>Felix Staacke</title>
  <link rel="stylesheet" href="../styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/site-shell.css">
  <script src="../shared/site-header.js" defer></script>
  <style>
    .contact-page {
      position: relative;
      min-height: calc(100vh - var(--df-header-height));
      padding-top: clamp(3rem, 8vw, 6.5rem);
      padding-bottom: 5rem;
      overflow: hidden;
    }
    .contact-page::before {
      position: absolute;
      z-index: -1;
      width: 34rem;
      height: 34rem;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(125, 211, 252, .15), transparent 68%);
      content: "";
      filter: blur(12px);
      inset: -13rem auto auto -12rem;
      pointer-events: none;
    }
    .contact-page__eyebrow {
      margin: 0 0 .7rem;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .contact-page h1 {
      margin: 0;
      font-size: clamp(2.35rem, 6vw, 4.25rem);
      letter-spacing: -.055em;
      line-height: 1;
    }
    .contact-page__intro {
      max-width: 34rem;
      margin: 1.25rem 0 2.2rem;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.65;
    }
    .contact-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      max-width: 760px;
    }
    .contact-option {
      position: relative;
      display: flex;
      min-height: 174px;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.5rem;
      border: 1px solid rgba(125, 211, 252, .18);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(28, 42, 61, .94), rgba(17, 20, 24, .98));
      box-shadow: 0 14px 34px rgba(2, 6, 23, .32);
      color: var(--text);
      isolation: isolate;
      overflow: hidden;
      text-decoration: none;
      transition: border-color .24s ease, box-shadow .24s ease, transform .24s ease;
    }
    .contact-option::after {
      position: absolute;
      z-index: -1;
      width: 12rem;
      height: 12rem;
      border-radius: 50%;
      background: rgba(125, 211, 252, .14);
      content: "";
      filter: blur(6px);
      inset: auto -5rem -7rem auto;
      transition: transform .3s ease;
    }
    .contact-option--github::after { background: rgba(167, 139, 250, .16); }
    .contact-option:hover,
    .contact-option:focus-visible {
      border-color: rgba(125, 211, 252, .75);
      box-shadow: 0 19px 42px rgba(2, 6, 23, .52), 0 0 0 4px rgba(125, 211, 252, .08);
      outline: none;
      transform: translateY(-4px);
    }
    .contact-option:hover::after,
    .contact-option:focus-visible::after { transform: scale(1.2); }
    .contact-option__icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(125, 211, 252, .3);
      border-radius: 13px;
      background: rgba(125, 211, 252, .11);
      color: var(--accent);
    }
    .contact-option--github .contact-option__icon {
      border-color: rgba(167, 139, 250, .3);
      background: rgba(167, 139, 250, .12);
      color: var(--accent-2);
    }
    .contact-option__icon svg { width: 22px; height: 22px; fill: currentColor; }
    .contact-option__label { display: block; margin-bottom: .35rem; color: var(--muted); font-size: .82rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .contact-option__value { display: block; font-size: 1.08rem; font-weight: 700; overflow-wrap: anywhere; }
    .contact-option__arrow { position: absolute; right: 1.45rem; bottom: 1.45rem; color: var(--accent); font-size: 1.3rem; transition: transform .24s ease; }
    .contact-option--github .contact-option__arrow { color: var(--accent-2); }
    .contact-option:hover .contact-option__arrow,
    .contact-option:focus-visible .contact-option__arrow { transform: translate(3px, -3px); }
    @media (max-width: 620px) {
      .contact-page { padding-top: 3rem; }
      .contact-options { grid-template-columns: 1fr; }
      .contact-option { min-height: 150px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .contact-option, .contact-option::after, .contact-option__arrow { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand" onclick="location.href='../index.html'"><div class="logo"></div><span>Felix Staacke</span></div>
      <nav>

        <a class="btn" href="projekte.html">Projekte</a>

  <main class="container contact-page">

    <section class="contact-options" aria-label="Kontaktmöglichkeiten">
      <a class="contact-option" href="mailto:datenflix@mail.de">

        <span><span class="contact-option__label">E-Mail schreiben</span><span class="contact-option__value">datenflix@mail.de</span></span>
        <span class="contact-option__arrow" aria-hidden="true">↗</span>
      </a>
      <a class="contact-option contact-option--github" href="https://github.com/datenflix007" target="_blank" rel="noopener noreferrer">

        <span><span class="contact-option__label">GitHub-Profil</span><span class="contact-option__value">@datenflix007</span></span>

      </a>
    </section>
  </main>
  <footer><div class="container">© 2025 Felix Staacke</div></footer>
</body>
</html>
