name: HTML Check

on:
  pull_request:
  push:
    branches:
      - main

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  html-check:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install html-validate
        run: npm install --global html-validate

      - name: Validate all HTML files
        run: |
          html-validate "**/*.html"