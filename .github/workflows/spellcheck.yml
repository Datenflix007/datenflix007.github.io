name: Spellcheck

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.html"
      - ".github/workflows/spellcheck.yml"
      - ".cspell.json"

  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.html"
      - ".github/workflows/spellcheck.yml"
      - ".cspell.json"

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  spellcheck:
    name: Check spelling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cspell
        run: npm install --global cspell

      - name: Run spellcheck
        run: |
          cspell \
            "**/*.md" \
            "**/*.html" \
            --config .cspell.json \
            --no-progress \
            --show-suggestions